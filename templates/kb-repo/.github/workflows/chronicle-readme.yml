name: chronicle-readme

on:
  push:
    branches: [main]
    paths:
      - 'chronicles/**'
      - 'scripts/build-tree.js'
      - 'scripts/update-readme.js'
      - 'scripts/update-indexes.js'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Regenerate indexes + README tree + interactive viewer
        run: |
          node scripts/update-indexes.js
          node scripts/update-readme.js
          mkdir -p docs
          node scripts/build-tree.js --html docs/index.html

      - name: Commit if changed
        run: |
          git config user.name 'chronicle-bot'
          git config user.email 'chronicle-bot@users.noreply.github.com'
          git add README.md docs/index.html chronicles/**/index.md || true
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chronicles: regenerate tree + indexes + viewer [skip ci]"
          git push

  deploy-pages:
    needs: regenerate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
        continue-on-error: true
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
